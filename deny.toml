# cargo-deny: run `cargo deny check` before a release (docs/testing.md).

[graph]
all-features = true

[advisories]
ignore = [
    # proc-macro-error is unmaintained; it comes in through gtk 0.18, which Tauri uses on Linux.
    # Nothing to do until Tauri moves off gtk-rs 0.18.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, through Tauri's gtk 0.18" },
    # Unmaintained crates that only the experimental GPUI front end (src-gpui, ADR 0009) pulls in through gpui 0.2.2.
    # None is a vulnerability, and src-gpui is not in the release bundles. Revisit when gpui is updated.
    { id = "RUSTSEC-2024-0384", reason = "instant, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2024-0436", reason = "paste, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2025-0052", reason = "async-std, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, through gpui (src-gpui only)" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, through gpui (src-gpui only)" },
]

[licenses]
# Every licence here is compatible with the app's GPL-3.0-or-later.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Tauri brings in older majors of several crates (gtk-rs 0.18, toml, syn); nothing to gain from refusing them.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
