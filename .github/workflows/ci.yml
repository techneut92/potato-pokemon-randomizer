name: CI

# Runs on every push to main and every pull request, and on demand. The same checks run locally with tools/ci.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install WebView build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      # rustup picks up rust-toolchain.toml; this installs it with rustfmt and clippy.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Generated TypeScript bindings are up to date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/lib/generated)" ]; then
            git status --short -- src/lib/generated
            echo "Run cargo test and commit src/lib/generated"
            exit 1
          fi
      - name: Randomization crates have no entropy source (ADR 0005)
        shell: bash
        run: |
          if cargo tree -p ppr-random -e normal --prefix none | grep -E '^(rand|getrandom) '; then exit 1; fi

      - name: Desktop bundles
        run: pnpm tauri build
      - uses: actions/upload-artifact@v5
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/release/bundle/*/*.deb
            target/release/bundle/*/*.rpm
            target/release/bundle/*/*.AppImage
            target/release/bundle/*/*.dmg
            target/release/bundle/*/*.msi
            target/release/bundle/*/*.exe
          if-no-files-found: error

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
