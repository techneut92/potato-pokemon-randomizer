name: Release

# Builds the bundles of a release on hosted runners and attaches them to a draft GitHub Release for the tag, with the
# version's CHANGELOG entry as notes: Linux (AppImage, .deb, .rpm), the Flatpak, Windows (NSIS and .msi) and a
# universal macOS .dmg. Runs when a v* tag is pushed, or on demand for an existing tag.
#
# Without hosted runners, tools/bundle.sh and tools/release.sh build and publish the same bundles from a Linux
# machine, without the .msi and .dmg; see docs/release.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage and the binary in the Flatpak run on older glibc too.
          - { name: linux, os: ubuntu-22.04, args: '' }
          # Tauri fetches WiX for the .msi itself.
          - { name: windows, os: windows-latest, args: '--bundles nsis,msi' }
          - { name: macos, os: macos-latest, args: '--target universal-apple-darwin --bundles dmg' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install WebView build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Add the macOS targets of the universal binary
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"

      - run: pnpm tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
      # The Flatpak packages this binary (packaging/flatpak).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: linux-binary
          if-no-files-found: error
          path: target/release/potato-pokemon-randomizer

  flatpak:
    name: Bundle (flatpak)
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-binary
          path: target/release
      - name: Bundle name
        id: name
        shell: bash
        run: echo "bundle=potato-pokemon-randomizer_${TAG#v}_x86_64.flatpak" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.techneut92.potato-pokemon-randomizer.yml
          bundle: ${{ steps.name.outputs.bundle }}
          artifact-name: bundles-flatpak
          cache: false

  release:
    name: Draft release
    needs: [bundle, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Create the draft release, or add the bundles to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t bundles < <(find bundles -type f | sort)
          printf '%s\n' "${bundles[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${bundles[@]}" --clobber
          else
            gh release create "$TAG" "${bundles[@]}" --draft --verify-tag --title "${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
